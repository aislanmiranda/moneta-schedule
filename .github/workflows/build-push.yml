# Build e push da imagem do scheduler no Harbor (projeto "moneta").
# Desenho: AM-4 (documento "architecture", §1).
#
# - push na main / workflow_dispatch na main: build + push, tag = SHA curto (7 chars) do commit
#   deste repositório (moneta-schedule).
# - pull_request para a main / workflow_dispatch em outra branch: só build (sem login, sem push).
# - O Dockerfile usa o contexto adicional "backend" (Domain/Application/Infra/Repository).
#   O workflow faz checkout de aislanmiranda/moneta-backend@main em ./backend e o passa via
#   build-contexts (equivalente buildx do "additional_contexts: backend" do docker-compose).
#   O SHA do backend usado fica no label moneta.backend.revision.
# - Sem tag "latest". Credenciais só via GitHub Secrets (HARBOR_USERNAME / HARBOR_PASSWORD).
name: build-push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-push-${{ github.ref }}
  # Builds da main nunca são cancelados; em PR/branch só o mais recente importa.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ${{ vars.HARBOR_REGISTRY || 'register.automaticenergy.com.br' }}
  PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout moneta-schedule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: schedule
          persist-credentials: false

      - name: Checkout moneta-backend (contexto adicional "backend")
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aislanmiranda/moneta-backend
          ref: main
          path: backend
          persist-credentials: false

      - name: SHA do backend usado
        id: backend
        run: echo "sha=$(git -C backend rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Tag da imagem (sha curto)
        id: vars
        run: echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login no Harbor
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build e push moneta/schedule
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./schedule
          build-contexts: backend=./backend
          push: ${{ env.PUBLISH == 'true' }}
          provenance: false
          tags: ${{ env.REGISTRY }}/moneta/schedule:${{ steps.vars.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            moneta.backend.revision=${{ steps.backend.outputs.sha }}
          cache-from: type=gha,scope=schedule
          cache-to: type=gha,scope=schedule,mode=max

      - name: Atualizar tag no moneta-deploy
        if: env.PUBLISH == 'true'
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          K3S_DEPLOY_KEY: ${{ secrets.K3S_DEPLOY_KEY }}
          IMAGES: "schedule"
          KFILE: apps/backend/kustomization.yaml
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          (umask 077; printf '%s\n' "$K3S_DEPLOY_KEY" > ~/.ssh/deploy_key)
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes"
          git clone --branch main git@github.com:aislanmiranda/moneta-deploy.git deploy
          cd deploy
          git config user.name "moneta-ci"
          git config user.email "moneta-ci@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for img in $IMAGES; do
              IMG="${REGISTRY}/moneta/${img}" yq -i \
                '(.images[] | select(.name == strenv(IMG))).newTag = strenv(TAG)' "$KFILE"
            done
            if git diff --quiet; then echo "tag já atualizada"; exit 0; fi
            git commit -am "ci: ${GITHUB_REPOSITORY#*/} ${IMAGES} -> ${TAG}"
            if git push origin HEAD:main; then exit 0; fi
            echo "push recusado (tentativa $attempt); repetindo"; sleep $((attempt * 3))
          done
          echo "falha ao atualizar o moneta-deploy" >&2; exit 1

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Imagem (${PUBLISH_LABEL})"
            echo "- \`${REGISTRY}/moneta/schedule:${TAG}\`"
            echo "- backend usado: \`aislanmiranda/moneta-backend@${BACKEND_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          PUBLISH_LABEL: ${{ env.PUBLISH == 'true' && 'publicada no Harbor' || 'só build, sem push' }}
          BACKEND_SHA: ${{ steps.backend.outputs.sha }}
